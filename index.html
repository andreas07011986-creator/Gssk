<script>  
(function() {

while (eingabe !== PASSWORT) {  
if (eingabe === null) {  
document.write("<div style='text-align:center; margin-top:50px; font-family:system-ui,-apple-system,sans-serif; background:#12141a; color:#e2e8f0; height:100vh; padding-top:40px;'><h2>Zugriff verweigert</h2><p>Bitte lade die Seite neu und gib das richtige Passwort ein.</p></div>");

}

})();

2. **Design-Reparatur:** Der Stylesheet-Bereich schließt nun sauber ab, sodass die App im modernen, dunklen IHK-Stil dargestellt wird.
3. **Punkte-System:** Am Ende der Fragen wird das Gesamtergebnis mit Bestehensquote (IHK-Wertung ab 50%) angezeigt.
