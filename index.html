<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSSK Prüfungstrainer & Konzept-Tool</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
    }
    .app-card {
      background: #ffffff;
      max-width: 700px;
      width: 100%;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    /* Tab-Navigation */
    .tab-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid #dee2e6;
      padding-bottom: 10px;
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: #e9ecef;
      color: #495057;
      font-weight: bold;
      font-size: 0.95rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .tab-btn.active {
      background: #0d6efd;
      color: white;
    }
    /* Quiz Styling */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .badge {
      background: #e9ecef;
      color: #495057;
      padding: 4px 10px;
      border-radius: 15px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-right: 5px;
    }
    .badge-sub {
      background: #e7f5ff;
      color: #1971c2;
    }
    .filter-box select, .concept-select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 1rem;
      margin-bottom: 15px;
    }
    .question-text {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 15px 0;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-option {
      padding: 12px;
      border: 2px solid #dee2e6;
      background: #fff;
      border-radius: 8px;
      text-align: left;
      cursor: pointer;
    }
    .correct { background-color: #d4edda !important; border-color: #28a745 !important; }
    .wrong { background-color: #f8d7da !important; border-color: #dc3545 !important; }
    .explanation-box {
      margin-top: 15px;
      padding: 12px;
      background: #e8f4f8;
      border-left: 4px solid #17a2b8;
      display: none;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }
    .btn-action {
      padding: 10px 18px;
      border: none;
      background: #0d6efd;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-action:disabled { background: #ccc; }

    /* Concept Styling */
    .concept-step {
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-left: 5px solid #0d6efd;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 4px;
    }
    .concept-title {
      font-weight: bold;
      color: #0d6efd;
      margin-bottom: 5px;
    }
    .solution-btn {
      width: 100%;
      padding: 10px;
      background: #198754;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      margin-top: 10px;
      cursor: pointer;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="app-card">
  <!-- TAB-NAVIGATION -->
  <div class="tab-nav">
    <button id="tabQuizBtn" class="tab-btn active" onclick="switchTab('quiz')">❓ Quiz-Trainer</button>
    <button id="tabConceptBtn" class="tab-btn" onclick="switchTab('concept')">📋 Sicherheitskonzept</button>
  </div>

  <!-- TAB 1: QUIZ TRAINER -->
  <div id="quizTab">
    <div class="header">
      <h3 style="margin:0;">Fragen-Trainer</h3>
      <span id="counter" style="font-weight: bold; color: #6c757d;">Frage 1/--</span>
    </div>

    <div class="filter-box">
      <select id="categoryFilter" onchange="filterQuestions()">
        <option value="all">Alle Themenbereiche</option>
        <option value="Recht">1. Rechts- und Aufgabenbezogenes Handeln</option>
        <option value="Technik">2. Gefahrenabwehr & Sicherheitstechnik</option>
        <option value="Verhalten">3. Verhalten & Kommunikation</option>
      </select>
    </div>

    <div>
      <span id="catBadge" class="badge">Kategorie</span>
      <span id="subCatBadge" class="badge badge-sub">Unterkategorie</span>
    </div>

    <div id="question" class="question-text">Frage wird geladen...</div>
    <div id="options" class="options"></div>

    <div id="explanation" class="explanation-box">
      <strong>💡 Erklärung & Rechtsgrundlage:</strong>
      <div id="explanationText" style="margin-top: 5px;"></div>
    </div>

    <div class="controls">
      <button id="prevBtn" class="btn-action" onclick="prevQuestion()">Zurück</button>
      <button id="nextBtn" class="btn-action" onclick="nextQuestion()">Nächste</button>
    </div>
  </div>

  <!-- TAB 2: SICHERHEITSKONZEPT MODUL -->
  <div id="conceptTab" class="hidden">
    <h3 style="margin-top:0;">GSSK Sicherheitskonzept Ausarbeiten</h3>
    <p style="font-size: 0.9rem; color: #555;">Wähle ein IHK-Szenario und gehe die 5 offiziellen Schritte für das Sicherheitskonzept durch:</p>

    <select id="conceptSelect" class="concept-select" onchange="loadConcept()">
      <option value="0">Fall 1: Logistikzentrum (Perimeterschutz & Werkschutz)</option>
      <option value="1">Fall 2: Rechenzentrum (Zutrittskontrolle & Brandschutz)</option>
      <option value="2">Fall 3: Einkaufszentrum (Mengensteuerung & Ladendiebstahl)</option>
    </select>

    <div id="conceptContent"></div>
  </div>
</div>

<script>
  // --- FRAGEN DATENBANK ---
  const questions = [
    {
      category: "Recht",
      subcategory: "Strafrecht (StGB)",
      question: "Wann liegt eine vorsätzliche Sachbeschädigung nach § 303 StGB vor?",
      options: [
        "Wenn eine fremde Sache rechtswidrig beschädigt oder zerstört wird.",
        "Wenn man versehentlich das Eigentum eines Kunden beschädigt.",
        "Wenn man eine eigene Sache aus Versehen fallen lässt.",
        "Wenn eine Sache nur geliehen und pünktlich zurückgegeben wird."
      ],
      answer: 0,
      explanation: "Eine Sachbeschädigung erfordert die Beschädigung oder Zerstörung einer fremden Sache. Vorsatz ist zwingend nötig; fahrlässige Sachbeschädigung ist im StGB nicht strafbar."
    },
    {
      category: "Recht",
      subcategory: "Strafprozessordnung (StPO)",
      question: "Welche Voraussetzung ist für die Festnahme nach § 127 Abs. 1 StPO (Jedermann-Festnahme) ZWINGEND erforderlich?",
      options: [
        "Der Täter muss der Sicherheitskraft persönlich bekannt sein.",
        "Der Täter muss auf frischer Tat betroffen oder verfolgt werden.",
        "Es muss ein schriftlicher Haftbefehl des Richters vorliegen.",
        "Der Schaden muss mindestens 500 Euro betragen."
      ],
      answer: 1,
      explanation: "Die Jedermann-Festnahme erlaubt jedem die vorläufige Festnahme, wenn jemand auf frischer Tat angetroffen oder verfolgt wird und Fluchtgefahr besteht bzw. die Identität nicht sofort geklärt werden kann."
    },
    {
      category: "Technik",
      subcategory: "Brandschutz",
      question: "Welche Brandklasse umfasst Brände von flüssigen oder flüssig werdenden Stoffen (z. B. Benzin, Lacke, Wachs)?",
      options: [
        "Brandklasse A",
        "Brandklasse B",
        "Brandklasse C",
        "Brandklasse F"
      ],
      answer: 1,
      explanation: "Brandklasse A = feste Stoffe, Brandklasse B = flüssige/flüssig werdende Stoffe, Brandklasse C = Gase, Brandklasse F = Speiseöle/Fette."
    },
    {
      category: "Verhalten",
      subcategory: "Deeskalation & Kommunikation",
      question: "Wie reagiert eine Sicherheitskraft in einer Konfliktsituation am besten auf eine verbal aggressive Person?",
      options: [
        "Ebenfalls laut werden, um Stärke zu demonstrieren.",
        "Ruhig und sachlich bleiben, aktives Zuhören anwenden und Distanz wahren.",
        "Die Person sofort körperlich fixieren.",
        "Sich umdrehen und die Person ignorieren."
      ],
      answer: 1,
      explanation: "Deeskalation erfordert eine ruhige, bestimmte Stimmlage, Sicherheitsabstand und sachliche Argumente, um die Lage zu beruhigen."
    }
  ];

  // --- SICHERHEITSKONZEPTE DATENBANK (5-SCHRITTE-MODELL) ---
  const concepts = [
    {
      title: "Fall 1: Logistikzentrum mit Freigelände",
      scenario: "Ein Logistikunternehmen meldet vermehrt Diebstähle von Palettenware auf dem Außengelände in den Nachtstunden. Erstelle das Sicherheitskonzept.",
      steps: [
        { name: "1. Objekt- & Ist-Analyse", text: "Weitläufiges Außengelände, teilweise lückenhafter Maschendrahtzaun, schlechte Ausleuchtung, unbesetzter Hintereingang." },
        { name: "2. Rechtliche Grundlagen", text: "BGB (§ 859 Selbsthilfe des Besitzers), StGB (§ 123 Hausfriedensbruch, § 242 Diebstahl), DSGVO bei Videoüberwachung auf dem Gelände." },
        { name: "3. Personelle Maßnahmen", text: "Bestellung eines Werk- und Objektschutzdienstes: Pförtner am Haupttor (24/7) sowie unregelmäßige Bestreifung des Außengeländes nachts." },
        { name: "4. Sicherheitstechnik", text: "Erneuerung des Zauns (2m Übersteigschutz), Installation einer ZKS (Zutrittskontrollanlage) für LKW-Fahrer, VdS-konforme Perimeter-Videoüberwachung mit Infrarot/Wärmebild." },
        { name: "5. Notfall- & Alarmplan", text: "Bei Alarmauslösung (Kamera/EMA): Aufschaltung auf eine VdS-zertifizierte Notruf- und Serviceleitstelle (NSL). Interventionskraft anfahren lassen, ggf. Polizei (110) hinzuziehen." }
      ]
    },
    {
      title: "Fall 2: Hochsicherheits-Rechenzentrum",
      scenario: "Schutz eines Rechenzentrums vor unbefugtem Zutritt, Spionage und Feuer.",
      steps: [
        { name: "1. Objekt- & Ist-Analyse", text: "Serverräume im Untergeschoss, hohe Kriterien an Ausfallsicherheit und Vertraulichkeit." },
        { name: "2. Rechtliche Grundlagen", text: "DSGVO (Datenschutz), ArbSchG, Hausrecht des Betreibers." },
        { name: "3. Personelle Maßnahmen", text: "Kontrolle des Besucherverkehrs, Begleitung von Fremdfirmen/Technikern (Escort-Service), Protokollierung." },
        { name: "4. Sicherheitstechnik", text: "Zwei-Faktoren-Zutrittskontrolle (RFID-Karte + Biometrie/PIN), Rauchansaugsysteme (RAS) zur Brandfrüherkennung, N2-Gaslöschanlage." },
        { name: "5. Notfall- & Alarmplan", text: "Direktauslösung BMA an die Feuerwehr, Räumungsplan für Personal, automatische Schottung der Serverräume." }
      ]
    },
    {
      title: "Fall 3: Einkaufszentrum (Shopping Mall)",
      scenario: "Gefahrenabwehr bei Großveranstaltungen, Deeskalation und Schutz vor Ladendiebstahl.",
      steps: [
        { name: "1. Objekt- & Ist-Analyse", text: "Hohes Publikumsaufkommen, viele Fluchtwege, unübersichtliche Bereiche, Ecken mit Vandalismusrisiko." },
        { name: "2. Rechtliche Grundlagen", text: "StPO § 127 (Vorläufige Festnahme), BGB § 227 (Notwehr), GewO & BewachV." },
        { name: "3. Personelle Maßnahmen", text: "Präsenzdienst im Innenbereich (Foot Patrol), Einsatz von Doormen / Ladendetektiven." },
        { name: "4. Sicherheitstechnik", text: "Flucht- und Rettungswegsicherung, CCTV-Kameras an Zu- und Ausgängen, Sprinkleranlage." },
        { name: "5. Notfall- & Alarmplan", text: "Lautsprecherdurchsagen für Räumung, Freihalten der Anfahrtswege für Rettungskräfte, Erste-Hilfe-Erstversorgung." }
      ]
    }
  ];

  // --- LOGIK & FUNCTIONS ---
  let currentQuestions = [...questions];
  let currentIndex = 0;
  let answered = false;

  function switchTab(tab) {
    if (tab === 'quiz') {
      document.getElementById("quizTab").classList.remove("hidden");
      document.getElementById("conceptTab").classList.add("hidden");
      document.getElementById("tabQuizBtn").classList.add("active");
      document.getElementById("tabConceptBtn").classList.remove("active");
    } else {
      document.getElementById("quizTab").classList.add("hidden");
      document.getElementById("conceptTab").classList.remove("hidden");
      document.getElementById("tabQuizBtn").classList.remove("active");
      document.getElementById("tabConceptBtn").classList.add("active");
      loadConcept();
    }
  }

  function filterQuestions() {
    const selected = document.getElementById("categoryFilter").value;
    currentQuestions = selected === "all" ? [...questions] : questions.filter(q => q.category === selected);
    currentIndex = 0;
    loadQuestion();
  }

  function loadQuestion() {
    answered = false;
    document.getElementById("explanation").style.display = "none";
    
    if (currentQuestions.length === 0) {
      document.getElementById("question").innerText = "Keine Fragen gefunden.";
      document.getElementById("options").innerHTML = "";
      return;
    }

    const q = currentQuestions[currentIndex];
    document.getElementById("counter").innerText = `Frage ${currentIndex + 1} von ${currentQuestions.length}`;
    document.getElementById("catBadge").innerText = q.category;
    document.getElementById("subCatBadge").innerText = q.subcategory || "Allgemein";
    document.getElementById("question").innerText = q.question;

    const optionsContainer = document.getElementById("options");
    optionsContainer.innerHTML = "";

    q.options.forEach((opt, index) => {
      const btn = document.createElement("button");
      btn.className = "btn-option";
      btn.innerText = opt;
      btn.onclick = () => checkAnswer(index, btn);
      optionsContainer.appendChild(btn);
    });

    document.getElementById("prevBtn").disabled = currentIndex === 0;
    document.getElementById("nextBtn").disabled = currentIndex === currentQuestions.length - 1;
  }

  function checkAnswer(selectedIndex, clickedBtn) {
    if (answered) return;
    answered = true;

    const q = currentQuestions[currentIndex];
    const buttons = document.querySelectorAll(".btn-option");

    buttons.forEach((btn, idx) => {
      if (idx === q.answer) btn.classList.add("correct");
    });

    if (selectedIndex !== q.answer) clickedBtn.classList.add("wrong");

    const expBox = document.getElementById("explanation");
    document.getElementById("explanationText").innerText = q.explanation;
    expBox.style.display = "block";
  }

  function nextQuestion() { if (currentIndex < currentQuestions.length - 1) { currentIndex++; loadQuestion(); } }
  function prevQuestion() { if (currentIndex > 0) { currentIndex--; loadQuestion(); } }

  // Concept Logic
  function loadConcept() {
    const idx = document.getElementById("conceptSelect").value;
    const c = concepts[idx];
    const container = document.getElementById("conceptContent");

    let html = `<p><strong>Szenario:</strong> ${c.scenario}</p>`;
    
    c.steps.forEach(step => {
      html += `
        <div class="concept-step">
          <div class="concept-title">${step.name}</div>
          <div>${step.text}</div>
        </div>
      `;
    });

    container.innerHTML = html;
  }

  window.onload = () => {
    loadQuestion();
  };
</script>
</body>
</html>
